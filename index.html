<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #111111;
      --accent-color: #38bdf8;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans Thai', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      padding: 20px;
      min-height: 100vh;
    }

    .toast {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--accent-color);
      color: var(--bg-color);
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      top: 20px;
    }

    h1 {
      text-align: center;
      margin: 20px 0 10px;
      color: var(--text-primary);
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      font-size: 1.1rem;
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .social-btn:hover {
      background-color: var(--accent-color);
      color: var(--bg-color);
    }

    .filter-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .filter-menu, .sub-filter-menu {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sub-filter-menu {
      display: none;
      padding: 8px 16px;
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 25px;
    }

    .sub-filter-menu.active {
      display: flex;
    }

    .filter-btn {
      padding: 8px 18px;
      font-size: 15px;
      font-weight: 600;
      background-color: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: var(--accent-color);
      color: var(--bg-color);
      border-color: var(--accent-color);
    }

    .sub-filter-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      background-color: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sub-filter-btn:hover, .sub-filter-btn.active {
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .gallery-container {
      max-width: 1100px;
      margin: 0 auto;
      column-count: 3;
      column-gap: 15px;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      position: relative;
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
    }

    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background-color: rgba(0, 0, 0, 0.6);
      border: 2px solid var(--accent-color);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      pointer-events: none;
      transition: transform 0.3s ease, background-color 0.3s ease;
      z-index: 1;
    }

    .play-icon::after {
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 8px 0 8px 14px;
      border-color: transparent transparent transparent var(--accent-color);
      margin-left: 3px;
    }

    .webapp-card-preview {
      padding: 30px 20px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 160px;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
    }

    .webapp-badge-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .webapp-card-preview .webapp-card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .btn-container {
      text-align: center;
      margin: 40px 0;
    }

    .btn-add {
      padding: 12px 28px;
      font-size: 16px;
      background-color: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-add:hover {
      background-color: var(--accent-color);
      color: var(--bg-color);
      transform: translateY(-2px);
    }

    .detail-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .detail-modal-overlay.active {
      display: flex;
    }

    .detail-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 800px;
      max-height: 90vh;
      border-radius: 12px;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-btn-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      background-color: var(--card-bg);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: all 0.2s;
    }

    .detail-btn-close:hover {
      background-color: var(--accent-color);
      color: var(--bg-color);
    }

    .detail-media-container {
      width: 100%;
      max-height: 60vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border-color);
    }

    .detail-media-container img {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
    }

    .detail-media-container iframe {
      width: 100%;
      height: 450px;
      max-height: 60vh;
      border: none;
    }

    .webapp-modal-preview {
      width: 100%;
      padding: 60px 20px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .btn-visit-app {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      background-color: var(--accent-color);
      color: var(--bg-color);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .btn-visit-app:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .detail-content {
      padding: 20px;
    }

    .detail-content h3 {
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .detail-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tag-badge {
      font-size: 12px;
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 3px 8px;
      border-radius: 12px;
    }

    .detail-content p {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-line;
    }

    @media (max-width: 768px) {
      .gallery-container {
        column-count: 2;
      }
    }

    @media (max-width: 480px) {
      .gallery-container {
        column-count: 2;
        column-gap: 10px;
      }
      
      .gallery-item {
        margin-bottom: 10px;
      }

      .detail-media-container iframe {
        height: 250px;
      }
    }
  </style>
</head>

    let pendingItems = [];

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function setMainFilter(category, btnElement) {
      activeMainCategory = category;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      if (category === 'image') {
        subFilterContainer.classList.add('active');
        activeSubCategory = 'all_image';
        resetSubFilterButtons();
      } else {
        subFilterContainer.classList.remove('active');
      }

      refreshGallery();
    }

    function setSubFilter(subCategory, btnElement) {
      activeSubCategory = subCategory;
      document.querySelectorAll('.sub-filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      refreshGallery();
    }

    function resetSubFilterButtons() {
      const subBtns = document.querySelectorAll('.sub-filter-btn');
      subBtns.forEach((btn, idx) => btn.classList.toggle('active', idx === 0));
    }

    function refreshGallery() {
      gallery.innerHTML = '';
      prepareFilteredItems();
      renderMoreItems();
    }

    function prepareFilteredItems() {
      let filtered = [];

      if (activeMainCategory === 'all') {
        filtered = mediaList;
      } else if (activeMainCategory === 'image') {
        const visualTags = ['illustration', 'graphic', '2d_animate'];
        filtered = mediaList.filter(item => 
          activeSubCategory === 'all_image' 
            ? item.tags?.some(tag => visualTags.includes(tag))
            : item.tags?.includes(activeSubCategory)
        );
      } else {
        filtered = mediaList.filter(item => item.tags?.includes(activeMainCategory));
      }
      
      pendingItems = shuffleArray([...filtered]);
    }

    function openModal(item) {
      modalMedia.innerHTML = '';
      if (item.type === 'youtube') {
        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${item.id}?autoplay=1`;
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        iframe.allowFullscreen = true;
        modalMedia.appendChild(iframe);
      } else if (item.type === 'webapp') {
        const container = document.createElement('div');
        container.className = 'webapp-modal-preview';
        container.innerHTML = `
          <a href="${item.link}" target="_blank" class="btn-visit-app">
            Open Web App <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
        `;
        modalMedia.appendChild(container);
      } else {
        const img = document.createElement('img');
        img.src = item.url;
        modalMedia.appendChild(img);
      }

      modalTitle.textContent = item.title || 'ไม่มีชื่อ';
      modalTags.innerHTML = '';
      
      const tagMap = { 
        illustration: 'Illustration', 
        graphic: 'Graphic', 
        '2d_animate': '2D Animate', 
        audio: 'Audio',
        webapp: 'Web App'
      };

      item.tags?.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag-badge';
        span.textContent = tagMap[tag] || tag;
        modalTags.appendChild(span);
      });

      modalDesc.textContent = item.desc || 'ไม่มีรายละเอียด';
      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      modalMedia.innerHTML = '';
    }

    function handleModalClick(e) {
      if (e.target === modalOverlay) closeModal();
    }

    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'gallery-item';

      if (item.type === 'youtube') {
        card.innerHTML = `
          <img loading="lazy" src="https://img.youtube.com/vi/${item.id}/hqdefault.jpg" alt="YouTube Video">
          <div class="play-icon"></div>
        `;
      } else if (item.type === 'webapp') {
        card.innerHTML = `
          <div class="webapp-card-preview">
            <div class="webapp-badge-text">Web App</div>
            <div class="webapp-card-title">${item.title}</div>
          </div>
        `;
      } else {
        card.innerHTML = `<img loading="lazy" src="${item.url}" alt="Artwork">`;
      }

      card.onclick = () => openModal(item);
      return card;
    }

    function renderMoreItems() {
      if (pendingItems.length === 0) {
        loadMoreBtn.style.display = 'none';
        return;
      }

      const itemsToRender = pendingItems.splice(0, 3);
      itemsToRender.forEach(item => gallery.appendChild(createCardElement(item)));

      loadMoreBtn.style.display = pendingItems.length > 0 ? 'inline-block' : 'none';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
        closeModal();
      }
    });

    prepareFilteredItems();
    renderMoreItems();
  </script>

</body>
</html>
